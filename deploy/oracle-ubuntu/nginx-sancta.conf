# Sancta — site, painel e API.
# Instalado pelo instalar.sh em /etc/nginx/sites-available/sancta, com o domínio no server_name.
# O certbot acrescenta o HTTPS (porta 443) e o redirecionamento a este mesmo arquivo.

# Recusa acessos pelo IP ou por domínios que não são do Sancta (robôs de varredura).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __NOMES__;

    root /var/www/sancta/backend/public;
    index index.php;
    charset utf-8;

    # Áudios do painel chegam a 50 MB (backend/config/livewire.php).
    client_max_body_size 64M;

    # Nada de arquivos ocultos (.env, .git…), exceto a validação do certificado.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o index.php executa PHP: nenhum outro .php (nem um enviado por upload) roda.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/sancta.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Arquivos estáticos; o CSS e o JS do site já levam a versão na URL.
    # Se o arquivo não existir (ex.: /livewire/livewire.min.js), quem responde é o Laravel.
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|mp3|m4a|aac|ogg|webmanifest)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
