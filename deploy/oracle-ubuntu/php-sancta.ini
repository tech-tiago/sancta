; Sancta — ajustes do PHP-FPM em produção, instalado em /etc/php/8.3/fpm/conf.d/99-sancta.ini.

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; O código só muda no deploy, e o sancta-atualizar recarrega o PHP-FPM no fim.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
