; Sancta — pool do PHP-FPM, instalado pelo instalar.sh em /etc/php/8.3/fpm/pool.d/sancta.conf.
; Roda como o usuário "sancta", dono do código; o Nginx (www-data) fala com ele pelo socket.

[sancta]
user = sancta
group = sancta
listen = /run/php/sancta.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 2 CPUs e 12 GB: até 24 processos (60 a 100 MB cada) deixam memória de sobra para o MySQL.
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

request_terminate_timeout = 130s
catch_workers_output = yes

php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
; Áudios do painel chegam a 50 MB (backend/config/livewire.php); o Nginx aceita 64 MB.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
